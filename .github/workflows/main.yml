name: Build Docker Image for Production

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up Docker BuildKit
        run: |
          mkdir -p ~/.docker
          echo '{"experimental": "enabled"}' > ~/.docker/config.json

      - name: Run production Docker build
        run: |
          chmod +x ./build-production.sh
          ./build-production.sh

      - name: Log into Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🟢 PASO AGREGADO: Si el script la construyó con otro nombre (ej. whatsapp-ecommerce)
      - name: Tag Docker image
        run: |
          docker tag whatsapp-ecommerce edrians/whatsapp-ecommerce:v1

      - name: Push Docker image to Docker Hub
        run: |
          docker push edrians/whatsapp-ecommerce:v1
